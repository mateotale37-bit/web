<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exportaciones De Productos Guatemaltecos S.A. EXPROGUASA</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0f3005; 
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      flex-direction: column;
    }

    #splash img.main {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      z-index: 1;
      position: relative;
    }

    /* Botón Fijo Arriba */
    #splash button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #d1931f;
      color: rgb(0, 0, 0);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
    }

    #splash button:hover {
      background: #b87f17;
    }

    /* Columnas laterales */
    .side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 150px; 
      overflow: hidden;
      z-index: 0;
      
      /* Aquí el fade */
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
    }

    .side-inner {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .left {
      left: 0;
    }

    .right {
      right: 0;
    }

    .left .side-inner {
      animation: scrollUp 25s linear infinite;
    }

    .right .side-inner {
      animation: scrollDown 25s linear infinite;
    }

    .side img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    /* Animaciones infinitas */
    @keyframes scrollUp {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }

    @keyframes scrollDown {
      0% { transform: translateY(-50%); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="splash">
    <!-- Columna izquierda -->
    <div class="side left">
      <div class="side-inner">
        <img src="Velutina.jpg" alt="Imagen 1">
        <img src="Caput Medusae.jpg" alt="Imagen 2">
        <img src="Seleriana.jpg" alt="Imagen 3">
        <img src="Spanish Moos.jpg" alt="Imagen 4">
        <!-- Se repiten -->
        <img src="Velutina.jpg" alt="Imagen 1 Repetida">
        <img src="Caput Medusae.jpg" alt="Imagen 2 Repetida">
        <img src="Seleriana.jpg" alt="Imagen 3 Repetida">
        <img src="Spanish Moos.jpg" alt="Imagen 4 Repetida">
      </div>
    </div>

    <!-- Columna derecha -->
    <div class="side right">
      <div class="side-inner">
        <img src="Velutina.jpg" alt="Imagen 5">
        <img src="Caput Medusae.jpg" alt="Imagen 6">
        <img src="Seleriana.jpg" alt="Imagen 7">
        <img src="Spanish Moos.jpg" alt="Imagen 8">
        <!-- Se repiten -->
        <img src="Velutina.jpg" alt="Imagen 5 Repetida">
        <img src="Caput Medusae.jpg" alt="Imagen 6 Repetida">
        <img src="Seleriana.jpg" alt="Imagen 7 Repetida">
        <img src="Spanish Moos.jpg" alt="Imagen 8 Repetida">
      </div>
    </div>

    <!-- Imagen principal 
    Fíjate que anteriormente me habías hecho un código em Html, bueno el código está super bien, sin embargo, me dijeron que estaría mejor que las imagenes que están en los lados izquiero y derecho que se mueve, queden mejor centradas en sus columnas, no que estén pegadas a la esquina. Podría enviarte mi código y tú corrijes eso 
    -->
    <img src="equis.jpg" alt="Imagen Principal (Más Grande) Con Slogan" class="main">

    <!-- Botón -->
    <button onclick="Entrar()">Continuar</button>
  </div>

  <script>
    function Entrar() {
      window.location.href = "numerone.html"; 
    }
  </script>

</body>
</html>
